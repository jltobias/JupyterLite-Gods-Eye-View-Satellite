<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="390" viewBox="0 0 1440 390" role="img" aria-labelledby="title desc">
<title id="title">From spatial context to a reviewed exercise handover</title><desc id="desc">Six steps: define the question, inspect provenance, compute in Python, compare 2D and 3D, ask Astra to explain and critique, review and export. The entire Riverbend scenario is synthetic.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#54cfbe" stroke-width="1.6"/></marker></defs>
<rect width="1440" height="390" rx="20" fill="#0b1e31"/>
<g font-family="system-ui, sans-serif"><text x="36" y="49" fill="#eaf4fd" font-size="28" font-weight="700">A map becomes useful when its evidence is traceable.</text><text x="36" y="82" fill="#a8bfd2" font-size="17">RIVERBEND LEARNING LOOP · SYNTHETIC DATA · HUMAN REVIEW</text>
<g fill="#132f46" stroke="#31536d"><rect x="30" y="120" width="210" height="192" rx="12"/><rect x="265" y="120" width="210" height="192" rx="12"/><rect x="500" y="120" width="210" height="192" rx="12"/><rect x="735" y="120" width="210" height="192" rx="12"/><rect x="970" y="120" width="210" height="192" rx="12"/><rect x="1205" y="120" width="205" height="192" rx="12"/></g>
<g fill="#56dfcc" font-size="15" font-weight="700"><text x="49" y="154">01 / QUESTION</text><text x="284" y="154">02 / PROVENANCE</text><text x="519" y="154">03 / COMPUTE</text><text x="754" y="154">04 / COMPARE</text><text x="989" y="154">05 / EXPLAIN</text><text x="1224" y="154">06 / REVIEW</text></g>
<g fill="#fff" font-size="22" font-weight="600"><text x="49" y="195">Define the task</text><text x="284" y="195">Know the source</text><text x="519" y="195">Make it explicit</text><text x="754" y="195">Change the view</text><text x="989" y="195">Ask Astra</text><text x="1224" y="195">Check each claim</text></g>
<g fill="#b9cddd" font-size="16"><text x="49" y="234">Place · time · people</text><text x="49" y="264">Decision and limits</text><text x="284" y="234">Date · CRS · license</text><text x="284" y="264">Quality and missingness</text><text x="519" y="234">Rates · distance · tests</text><text x="519" y="264">Reproducible Python</text><text x="754" y="234">Counts vs denominators</text><text x="754" y="264">2D · 3D · time</text><text x="989" y="234">Cited evidence packet</text><text x="989" y="264">Unknowns and critique</text><text x="1224" y="234">Human verification</text><text x="1224" y="264">Export and hand over</text></g>
<g stroke="#54cfbe" stroke-width="2" marker-end="url(#arrow)"><path d="M240 217h19"/><path d="M475 217h19"/><path d="M710 217h19"/><path d="M945 217h19"/><path d="M1180 217h19"/></g>
<text x="36" y="355" fill="#ffcf82" font-size="17">Visible does not mean current. Structured does not mean true. A spatial pattern does not establish a cause.</text></g></svg>
