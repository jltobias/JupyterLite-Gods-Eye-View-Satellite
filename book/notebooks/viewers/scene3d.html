<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riverbend | 3D training scene</title>
<script>window.CESIUM_BASE_URL='https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/';</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Cesium.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Widgets/widgets.css">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#081627;color:#eff8ff;font:14px system-ui,sans-serif}#globe{position:absolute;inset:116px 0 0}.toolbar{position:relative;z-index:1;padding:14px 18px;background:#0c1f32;border-bottom:1px solid #315271}h1{font-size:21px;margin:0 0 9px}.tag{color:#ffd083;font-size:11px;letter-spacing:1px}button{padding:6px 12px;background:#16364e;color:#e6f5ff;border:1px solid #45677f;border-radius:4px;cursor:pointer;font:inherit}label{margin-left:10px}#status{position:absolute;top:125px;left:12px;z-index:2;background:#081627e8;padding:10px;border-radius:5px;max-width:440px;font-size:12px;line-height:1.5;pointer-events:none}.cesium-viewer-bottom{background:#122436b3}input{vertical-align:middle}@media(max-width:600px){#globe{top:155px}#status{top:165px}.toolbar{min-height:155px}label{display:block;margin:8px 0}}
</style></head><body>
<div class="toolbar"><div class="tag">SYNTHETIC EXERCISE · ELLIPSOID, NO REAL TERRAIN</div><h1>Riverbend / a spatial briefing in 3D</h1>
<button id="home">Frame sectors</button> <button id="flat">2D</button> <button id="three">3D</button> <button id="play">Play / pause route</button>
<label>Column scale <input id="scale" type="range" min="0" max="30" value="10" step="1" aria-label="Column height metres per reported case per ten thousand"> <span id="scaleValue">10</span> m per case/10k</label></div>
<div id="status" role="status">Loading Cesium. If WebGL or the CDN is unavailable, use notebook 09's static 3D plot.</div><div id="globe" aria-label="Cesium 3D scene with synthetic sectors and animated logistics route"></div>
<script>
const data=__SCENARIO_JSON__;
async function boot(){
Cesium.Ion.defaultAccessToken='';
const viewer=new Cesium.Viewer('globe',{baseLayer:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,timeline:true,animation:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),shouldAnimate:false});
viewer.imageryLayers.addImageryProvider(new Cesium.GridImageryProvider({cells:16,color:Cesium.Color.fromCssColorString('#285573'),backgroundColor:Cesium.Color.fromCssColorString('#0b2436')}));
viewer.scene.globe.enableLighting=false;
viewer.creditDisplay.addStaticCredit(new Cesium.Credit('Fictional Riverbend exercise • original lab inspired by Bilawal Sidhu’s God’s Eye View'),true);
const ds=await Cesium.GeoJsonDataSource.load(data,{clampToGround:false,stroke:Cesium.Color.fromCssColorString('#92c9cc'),fill:Cesium.Color.fromCssColorString('#38bdb1').withAlpha(.7),markerColor:Cesium.Color.ORANGE,markerSize:20});
await viewer.dataSources.add(ds);
function columns(){const scale=Number(document.getElementById('scale').value);document.getElementById('scaleValue').textContent=scale;
for(const e of ds.entities.values){if(e.polygon){e.polygon.height=0;e.polygon.extrudedHeight=(e.properties.rate_10000?.getValue()||0)*scale;e.polygon.material=Cesium.Color.fromCssColorString('#34c6b8').withAlpha(.78)}}viewer.scene.requestRender()}
columns();document.getElementById('scale').oninput=columns;
document.getElementById('home').onclick=()=>viewer.flyTo(ds,{duration:1,offset:new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-45),105000)});
document.getElementById('flat').onclick=()=>viewer.scene.morphTo2D(1);
document.getElementById('three').onclick=()=>viewer.scene.morphTo3D(1);
const start=Cesium.JulianDate.fromIso8601('2026-09-15T12:00:00Z');const stop=Cesium.JulianDate.addSeconds(start,3600,new Cesium.JulianDate());
const position=new Cesium.SampledPositionProperty();
[[0,32.71,7.64,5000],[1800,32.90,7.78,5000],[3600,33.09,7.61,5000]].forEach(([t,lon,lat,h])=>position.addSample(Cesium.JulianDate.addSeconds(start,t,new Cesium.JulianDate()),Cesium.Cartesian3.fromDegrees(lon,lat,h)));
viewer.entities.add({id:'synthetic-logistics-route',name:'Illustrative route — not navigable',availability:new Cesium.TimeIntervalCollection([new Cesium.TimeInterval({start,stop})]),position,point:{pixelSize:13,color:Cesium.Color.ORANGE,outlineColor:Cesium.Color.WHITE,outlineWidth:2},path:{resolution:30,material:Cesium.Color.ORANGE,width:3,leadTime:3600,trailTime:3600}});
viewer.clock.startTime=start.clone();viewer.clock.stopTime=stop.clone();viewer.clock.currentTime=start.clone();viewer.clock.clockRange=Cesium.ClockRange.LOOP_STOP;viewer.clock.multiplier=120;viewer.timeline.zoomTo(start,stop);
document.getElementById('play').onclick=()=>{viewer.clock.shouldAnimate=!viewer.clock.shouldAnimate};
await viewer.flyTo(ds,{duration:0,offset:new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-45),105000)});
document.getElementById('status').textContent='Columns encode reported cases per 10,000, not building heights. Teal = sectors; amber = clinics and an invented route at 5,000 m. Drag to rotate; use the time strip to scrub. No terrain, imagery or API token required; Cesium assets load from CDN.';
}
boot().catch(error=>{document.getElementById('status').textContent='3D viewer unavailable: '+error.message+'. Use the static notebook plot; no analysis depends on WebGL.'});
</script></body></html>
